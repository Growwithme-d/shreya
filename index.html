<title>A Refined Skill Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#100f0a;--card:#0e0d09;--gold:#c99d4e;--gold-soft:#d9b46a;--cream:#f6eedc;--muted:#d6cfbf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:560px;background:var(--card);border:1px solid rgba(201,157,78,.55);border-radius:36px;padding:68px 40px 56px;text-align:center}
.avatar{width:180px;height:180px;margin:0 auto 44px;border-radius:50%;border:5px solid var(--gold);background:linear-gradient(160deg,#6b6b68,#2b2a27);box-shadow:0 0 40px rgba(201,157,78,.28);overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0 0 28px;font-weight:800;font-size:clamp(2rem,7vw,2.75rem);line-height:1.15;letter-spacing:-.02em}
.tag{margin:0 0 44px;font-weight:600;font-size:1.15rem;color:var(--gold-soft)}
h2{margin:0 0 20px;font-weight:800;font-size:1.8rem;letter-spacing:-.01em}
.sub{margin:0 0 40px;font-size:1.1rem;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;padding:26px 20px;background:var(--gold);color:#0c0b07;border-radius:28px;font-weight:600;font-size:1.3rem;text-decoration:none;box-shadow:0 10px 40px rgba(201,157,78,.25);transition:transform .15s ease,background .15s ease}
.btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.btn svg{width:30px;height:30px;fill:currentColor;flex:none}
@media(max-width:480px){.card{padding:48px 22px 40px;border-radius:28px}.avatar{width:150px;height:150px;margin-bottom:34px}h2{font-size:1.5rem}.btn{font-size:1.15rem;padding:22px 16px}}
</style>
